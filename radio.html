<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>JOCA Radio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #071324;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
}

.logo {
  color: #66d9ff;
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 7px;
}

a {
  color: #66d9ff;
  text-decoration: none;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 20px 20px 170px;
}

h2 { color: #66d9ff; }

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button, input, select {
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  color: white;
  background: #152740;
}

input { flex: 1; min-width: 160px; }

button { cursor: pointer; }

button:hover { background: #087fce; }

.primary { background: #087fce; }

.stations {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.station {
  background: #12233c;
  border: 1px solid #213e5e;
  border-radius: 18px;
  padding: 18px;
}

.station img {
  width: 65px;
  height: 65px;
  object-fit: contain;
  border-radius: 12px;
  background: #20334d;
}

.station h3 {
  overflow-wrap: anywhere;
}

.station p {
  color: #91a8c4;
  font-size: 14px;
}

.actions {
  display: flex;
  gap: 10px;
}

.actions button:first-child {
  flex: 1;
}

.favorite { color: #ff647c; }

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #101e34;
  border-top: 1px solid #285477;
  padding: 15px 20px;
  box-shadow: 0 -5px 30px #0006;
}
